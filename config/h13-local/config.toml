# OFFLINE PREPARATION ONLY. Do not run from the repository root.
# Pinned Supabase CLI 2.121.0; copy into the dedicated ignored workspace.
project_id = "campusstay-h13-local-staging"

[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[api.tls]
enabled = false

[db]
port = 55322
shadow_port = 55320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 55329

[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false
port = 55323
api_url = "http://127.0.0.1:55321"

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "5MiB"

[storage.s3_protocol]
enabled = false

[storage.image_transformation]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:55321"
external_url = "http://127.0.0.1:55321/auth/v1"
additional_redirect_urls = ["http://127.0.0.1:55321/auth/callback", "http://127.0.0.1:55321/auth/recovery"]
jwt_expiry = 3600
signing_keys_path = "./signing_keys.json"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 55328
deno_version = 2

[analytics]
enabled = false
port = 55327
